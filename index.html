<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#15120f" />
    <meta name="description" content="Keep score in board games." />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <title>Score Counter</title>
  </head>
  <body>
    <header>
      <h1>Score Counter</h1>
      <div class="actions">
        <button id="undo" type="button" disabled>Undo</button>
        <button id="new-game" type="button">New game</button>
      </div>
    </header>

    <main>
      <section class="round-bar">
        <h2 id="round-title">Round 1</h2>
        <button id="next-round" class="primary" type="button">Next round</button>
      </section>

      <fieldset class="step">
        <legend>Step</legend>
        <label><input type="radio" name="step" value="1" checked />1</label>
        <label><input type="radio" name="step" value="5" />5</label>
        <label><input type="radio" name="step" value="10" />10</label>
      </fieldset>

      <ul id="players"></ul>

      <form id="add-player">
        <input name="name" placeholder="Player name" autocomplete="off" maxlength="30" />
        <button type="submit">Add player</button>
      </form>

      <div class="table-wrap">
        <table id="rounds" aria-label="Scores per round"></table>
      </div>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
